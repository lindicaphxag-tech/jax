name: JAX Poisson batch-certified central admission A/B
on:
  push:
    branches:
      - experiment/poisson-batched-central-admission-20261023
  pull_request:
    branches:
      - ci/poisson-41228-exacthead-review-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batched-conditional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native JAX CPU and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ci]" scipy pytest absl-py parameterized ruff
      - name: Check production Python and lint
        run: |
          python -m py_compile jax/_src/random/core.py ci/poisson_batched_central_ab.py
          ruff check jax/_src/random/core.py
      - name: Matched-source stable versus lazy-central sampler and timing
        run: python ci/poisson_batched_central_ab.py
      - name: Native Poisson public log-PMF and sampling regression
        if: runner.os == 'Linux'
        run: |
          python -m pytest tests/scipy_stats_test.py -q -k 'PoissonLogPmf'
          python -m pytest tests/random_lax_test.py -q -k 'PoissonLargeLambdaVariance'
