name: Validate PR 41227 Student-t numeric fix

on:
  push:
    branches:
      - ci/validate-student-t-41227-20261011

permissions:
  contents: read

jobs:
  targeted-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . scipy pytest absl-py
      - name: Student-t regression
        run: python -m pytest tests/scipy_stats_test.py -k TLogPdfLargeDf -q
