name: Poisson CPU numerical contract (fork-only)
on:
  push:
    branches:
      - research/poisson-hotpath-benchmark-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poisson-cpu-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible CPU diagnostic runtime
        run: python -m pip install "jax[cpu]==0.9.0.1" "scipy>=1.14,<2" "numpy>=2,<3"
      - name: JIT/vmap/grad/Hessian contract
        run: python benchmarks/poisson_ad_contract_cpu_20261026.py
      - name: Production-body pre/post acceptance A/B
        run: python benchmarks/poisson_source_matched_cpu_ab_20261026.py
