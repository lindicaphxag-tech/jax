name: JAX #41228 exact-head paired sampler benchmark
on:
  push:
    branches:
      - ci/poisson-exact-head-paired-perf-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-poisson-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native JAX with CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ci]" scipy
      - name: Paired warm CPU timing and variance evidence
        run: python ci/poisson_41228_paired_perf.py
      - name: Sixteen independent seed distributions (same PR source)
        run: python ci/poisson_41228_multiseed_accuracy.py
