name: Validate PR 41228 Poisson numeric fix

on:
  push:
    branches:
      - ci/validate-poisson-41228-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . scipy pytest absl-py
      - name: Random Poisson regressions
        run: |
          python -m pytest tests/random_lax_test.py -q \
            -k "PoissonLargeLambdaLogPmf or PoissonRejectionLogPmfMatchesScipy or PoissonCentralDevianceAvoidsFloat32Cancellation or PoissonLogPmfTinyRateGradientsRemainFinite or PoissonLargeLambdaVariance"
      - name: Public scipy.stats.poisson regressions
        run: |
          python -m pytest tests/scipy_stats_test.py -q \
            -k "PoissonLogPmfLargeLambda or PoissonLogPmfCentralFloat32Accurate or PoissonLogPmfLargeCountFarTailFloat32 or PoissonLogPmfPublicApiTinyRateAutodiff or PoissonLogPmfTinyRateSecondDerivative or PoissonLogPmfTinyRateFarTail"
      - name: Diff hygiene
        run: git diff --check HEAD^..HEAD || true
