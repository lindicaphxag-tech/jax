name: Poisson #41228 exact-head CPU benchmark

on:
  push:
    branches:
      - research/poisson-41228-cpu-perf-evidence-20261118
  pull_request:
    branches:
      - research/poisson-41228-cpu-perf-evidence-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source is unchanged from official PR head
        run: |
          git diff --exit-code 9428e21c09e6a19cadbf9ed02d6ec78b165f6246 HEAD -- jax/_src/random/core.py
          python -m compileall -q research/poisson_41228_benchmark.py
      - name: Install source checkout and runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install scipy
      - name: Check native current-head Poisson numerical statistics
        run: |
          python research/poisson_41228_native_gate.py
      - name: Execute paired float32 Poisson benchmark
        run: |
          python research/poisson_41228_benchmark.py --n 65536 --seeds 9 --output poisson_41228_exact_head_results.json
      - name: Upload raw result for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poisson-41228-exact-head-cpu
          path: poisson_41228_exact_head_results.json
          if-no-files-found: warn
