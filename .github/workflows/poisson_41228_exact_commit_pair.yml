name: JAX Poisson 41228 exact-commit native CPU pair (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-pair:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            sha: d3f12669d7db55596d413eba9cfcd214ae5a3ea4
          - name: candidate
            sha: 9428e21c09e6a19cadbf9ed02d6ec78b165f6246
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout benchmark evidence branch
        uses: actions/checkout@v4
        with:
          ref: evidence/41228-native-rejection-benchmark-20261119
          path: evidence
      - name: Checkout exact JAX source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checked-out JAX and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./source[ci]" scipy numpy
      - name: Verify source checkout SHA and interpreter import
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          python - <<'PY'
          import jax
          from pathlib import Path
          assert Path(jax.__file__).resolve().is_relative_to(Path.cwd().resolve())
          assert jax.default_backend() == "cpu"
          print(jax.__version__, jax.__file__)
          PY
      - name: Benchmark native checked-out source
        working-directory: source
        run: |
          python ../evidence/research/validation/benchmark_poisson_41228_native.py --require-sha ${{ matrix.sha }} --out ../${{ matrix.name }}.json
      - name: Save raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-poisson-${{ matrix.name }}
          path: ${{ matrix.name }}.json
          if-no-files-found: warn

  compare:
    needs: cpu-pair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidence/41228-native-rejection-benchmark-20261119
      - uses: actions/download-artifact@v4
        with:
          name: native-poisson-baseline
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: native-poisson-candidate
          path: candidate
      - name: Produce descriptive ratio report
        run: |
          python research/validation/compare_poisson_41228_native.py baseline/baseline.json candidate/candidate.json --out comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-poisson-paired-report
          path: comparison.json
