name: Poisson current-head upstream review acceptance gate
on:
  pull_request:
    branches:
      - fix/poisson-large-lambda-41202
  push:
    branches:
      - ci/jax-41228-integer-support-20261026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact checkout JAX native tests and oracle
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ci]" scipy pytest absl-py parameterized ruff
      - name: Verify source checkout, syntax, lint
        run: |
          python -c "import jax; from jax._src.random import core; print('JAX',jax.__version__, 'jaxlib',jax.lib.__version__,'core',core.__file__,'devices',jax.devices())"
          python -m py_compile jax/_src/random/core.py tests/random_lax_test.py tests/scipy_stats_test.py ci/poisson_native_sampler_review_benchmark.py
          ruff check jax/_src/random/core.py tests/random_lax_test.py tests/scipy_stats_test.py
      - name: Matched-source real sampling, CPU performance and held-out seeds
        run: python ci/poisson_native_sampler_review_benchmark.py
      - name: Mathematical central polynomial remainder certificate
        if: runner.os == 'Linux'
        run: python ci/poisson_central_deviance_remainder_certificate.py
      - name: Native public Poisson and rejection sampling test suites
        if: runner.os == 'Linux'
        run: python -m pytest tests/scipy_stats_test.py tests/random_lax_test.py -q -k 'Poisson'
      - name: Float64 enabled consolidated Poisson accuracy and extreme tail
        if: runner.os == 'Linux'
        env:
          JAX_ENABLE_X64: "true"
        run: python -m pytest tests/scipy_stats_test.py -q -k 'PoissonLogPmf'
      - name: Upload exact-head reviewer numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poisson-current-head-${{ matrix.os }}
          path: poisson_sampler_benchmark.json
          if-no-files-found: ignore
