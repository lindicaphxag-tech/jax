name: JAX Poisson review benchmark (CPU)
on:
  pull_request:
    paths:
      - "ci/review_poisson_sampling_benchmark.py"
      - "jax/_src/random/core.py"
      - ".github/workflows/review_poisson_benchmark.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  poisson-review:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matching JAX CPU runtime and reference SciPy
        run: python -m pip install "jax[cpu]==0.11.2" scipy pytest absl-py
      - name: Compile benchmark and relevant source
        run: |
          python -m py_compile ci/review_poisson_sampling_benchmark.py jax/_src/random/core.py
      - name: Compare exact old and proposed Poisson rejection in the same installed runtime
        run: PYTHONPATH="$PWD" python ci/review_poisson_sampling_benchmark.py

      - name: Run focused native sampling variance and public Poisson regression tests
        run: |
          PYTHONPATH="$PWD" python -m pytest tests/random_lax_test.py -q -k PoissonLargeLambdaVariance
          PYTHONPATH="$PWD" python -m pytest tests/scipy_stats_test.py -q -k PoissonLogPmf
