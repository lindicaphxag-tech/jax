name: Poisson log-PMF CPU microbenchmark

on:
  push:
    branches:
      - validation/poisson-logpmf-benchmark-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-microbenchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jax[cpu]==0.11.2"
      - name: Run microbenchmark
        run: python benchmarks/poisson_logpmf_pr41228_microbench.py
